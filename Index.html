
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Music</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">♥</div>
      <div>
        <h1>Pulse</h1>
        <p>Music that matches your heartbeat</p>
      </div>
    </header>

    <section class="heart-card">
      <p class="label">CURRENT HEART RATE</p>
      <div class="heart-rate">
        <span id="bpm">72</span>
        <small>BPM</small>
      </div>
      <p id="mood">Relaxed mood</p>
    </section>

    <section class="mood-buttons">
      <h2>Choose a mood</h2>
      <div class="button-row">
        <button class="mood-button active" data-bpm="72" data-mood="Relaxed mood" data-song="Moonlight Drive">Chill</button>
        <button class="mood-button" data-bpm="105" data-mood="Focused mood" data-song="Deep Focus">Focus</button>
        <button class="mood-button" data-bpm="145" data-mood="Workout mood" data-song="Run Faster">Workout</button>
      </div>
    </section>

    <section class="slider">
      <div class="sslidercontainer">
        <input type="range" min="72" max="145" value="72" class="slider" id="myRange">
      </div>
    </section>

    <section class="player">
      <div class="album-art">♪</div>
      <div class="song-info">
        <p class="label">NOW PLAYING</p>
        <h2 id="song-title">Moonlight Drive</h2>
        <p>Pulse Playlist</p>
      </div>
      <button id="play-button" class="play-button" aria-label="Play music">▶</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
